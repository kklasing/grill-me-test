services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: grill-me-test-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: grill_me_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d grill_me_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
